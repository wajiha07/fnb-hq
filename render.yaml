# Render Blueprint — one public URL (UI + /api) + managed Postgres

databases:
  - name: fnb-db
    databaseName: fnb_hq
    user: fnb
    plan: free

services:
  - type: web
    name: fnb-hq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-db
          property: connectionString