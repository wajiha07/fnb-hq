# Render Blueprint — F&B HQ (API + Web + Postgres)
# After connecting this repo in Render, or use "Deploy to Render" from README.

databases:
  - name: fnb-db
    databaseName: fnb_hq
    user: fnb
    plan: free

services:
  - type: web
    name: fnb-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-db
          property: connectionString

  - type: web
    name: fnb-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: web
          name: fnb-api
          property: hostport