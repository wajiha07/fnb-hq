services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fnb
      POSTGRES_PASSWORD: fnb_secret
      POSTGRES_DB: fnb_hq
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnb -d fnb_hq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://fnb:fnb_secret@db:5432/fnb_hq
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
