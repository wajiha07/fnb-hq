name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fnb
          POSTGRES_PASSWORD: fnb_secret
          POSTGRES_DB: fnb_hq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fnb -d fnb_hq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and migrate API
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fnb:fnb_secret@localhost:5432/fnb_hq
        run: |
          npm ci
          npm run migrate
          npm run seed
      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fnb:fnb_secret@localhost:5432/fnb_hq
          PORT: 4000
        run: node src/server.js &
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: Requirements check
        run: BASE_URL=http://127.0.0.1:4000/api ./scripts/requirements-check.sh